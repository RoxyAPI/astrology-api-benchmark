# Publishes the report page, the latest PDF, robots.txt and sitemap.xml at stable addresses on
# GitHub Pages. The page is generated by the benchmark package, so a change there redeploys it.
name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - "domains/**"
      - "results/**"
      - "site/**"
      - "README.md"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked --group report
      - run: uv run playwright install --with-deps chromium
      - run: uv run python -m benchmark site
      - run: uv run python -m benchmark.report --pdf dist/report.pdf
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
